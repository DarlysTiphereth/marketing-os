name: Foundation v0.1

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node: '24'
          - os: ubuntu-latest
            node: '24'
          - os: macos-latest
            node: '24'
          - os: ubuntu-latest
            node: '22.18.0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run validate:skills
      - run: pnpm test
      - name: CLI exit-code smoke checks
        run: node scripts/ci-smoke.mjs
      - name: Git line-ending evidence and fixture assertions
        run: node scripts/assert-fixture-eol.mjs
      - run: git diff --check
      - run: git diff --exit-code
      - name: Assert clean repository including untracked files
        run: node -e "const s = require('node:child_process').execFileSync('git', ['status', '--porcelain'], {encoding:'utf8'}); process.stdout.write(s); if (s.trim()) process.exit(1);"
