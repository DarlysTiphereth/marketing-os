name: Foundation v0.1

# Light CI for free quotas: pushes run one Ubuntu job; the full OS/Node matrix runs on pull requests and manual dispatch.
# Render job branches are excluded (they have their own workflow).
on:
  push:
    branches-ignore: ['render-jobs/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"ubuntu-latest","node":"24"}]' || '[{"os":"windows-latest","node":"24"},{"os":"ubuntu-latest","node":"24"},{"os":"macos-latest","node":"24"},{"os":"ubuntu-latest","node":"22.18.0"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run validate:skills
      - run: pnpm test
      - name: Ops control-plane tests (Node 24 type stripping)
        if: matrix.node == '24'
        run: node --test ops/tests/ops.test.ts
      - name: CLI exit-code smoke checks
        run: node scripts/ci-smoke.mjs
      - name: Git line-ending evidence and fixture assertions
        run: node scripts/assert-fixture-eol.mjs
      - run: git diff --check
      - run: git diff --exit-code
      - name: Assert clean repository including untracked files
        run: node -e "const s = require('node:child_process').execFileSync('git', ['status', '--porcelain'], {encoding:'utf8'}); process.stdout.write(s); if (s.trim()) process.exit(1);"
